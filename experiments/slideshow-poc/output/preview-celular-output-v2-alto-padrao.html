<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview Celular - Output V2 Alto Padrao</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --phone: #0b1220;
        --edge: #1d2a3f;
        --soft: #dce7f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(34, 91, 125, 0.35), transparent 32%),
          linear-gradient(135deg, #f6f8fb 0%, #dce4ee 38%, var(--bg) 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }

      .stage {
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      .phone {
        position: relative;
        width: min(390px, calc(100vw - 32px));
        aspect-ratio: 9 / 19.5;
        padding: 12px;
        border-radius: 44px;
        background: linear-gradient(160deg, #0e1726, var(--phone));
        box-shadow:
          0 34px 90px rgba(4, 12, 24, 0.44),
          inset 0 0 0 1px rgba(255, 255, 255, 0.12),
          inset 0 0 0 4px rgba(255, 255, 255, 0.035);
      }

      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 34px;
        background: #000;
      }

      .notch {
        position: absolute;
        top: 11px;
        left: 50%;
        z-index: 2;
        width: 108px;
        height: 28px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.92);
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }

      .caption {
        margin: 0;
        max-width: 560px;
        color: #233045;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
      }

      .caption strong {
        color: #08111f;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Preview em celular">
      <div class="phone">
        <div class="screen">
          <div class="notch" aria-hidden="true"></div>
          <video controls autoplay muted loop playsinline>
            <source src="./output-v2-alto-padrao-legendas.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
      <p class="caption">
        <strong>Preview celular</strong> - simulacao de visualizacao vertical full screen do anuncio.
      </p>
    </main>
  </body>
</html>
